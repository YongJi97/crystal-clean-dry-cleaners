name: CrystalClean
options:
  bundleIdPrefix: com.yongji97
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

configs:
  Debug: debug
  Release: release

fileGroups:
  - Config
  - README.md

targets:
  CrystalClean:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CrystalClean
        excludes:
          - Resources/PrivacyInfo.xcprivacy
      - path: CrystalClean/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yongji97.crystalclean
        PRODUCT_NAME: CrystalClean
        PRODUCT_MODULE_NAME: CrystalClean
        INFOPLIST_FILE: CrystalClean/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # xcodegen generate rewrites Info.plist from these properties.
    # Every key has to live here or the next generate drops it.
    info:
      path: CrystalClean/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleDisplayName: Crystal Clean
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes:
          - comgooglemaps
        APP_API_KEY: "$(APP_API_KEY)"

  CrystalCleanTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CrystalCleanTests
      - path: CrystalClean/Resources/services.json
        type: file
        buildPhase: resources
    dependencies:
      - target: CrystalClean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yongji97.crystalclean.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  CrystalClean:
    build:
      targets:
        CrystalClean: all
        CrystalCleanTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-useLocalBridge": false
        "-testMode": false
        "-seedDemo": false
        "-showConfirmation": false
        "-startTab requests": false
    test:
      config: Debug
      targets:
        - CrystalCleanTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
