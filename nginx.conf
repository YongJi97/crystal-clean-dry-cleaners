user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Echo Access-Control-Allow-Origin only for the two public site hosts.
    map $http_origin $cors_allow_origin {
        default "";
        "https://crystalcleandrycleaner.com" $http_origin;
        "https://www.crystalcleandrycleaner.com" $http_origin;
    }

    # 10 requests/minute per IP. burst=5 covers the CORS preflight plus a retry
    # without queueing the customer. Further requests get 429.
    limit_req_zone $binary_remote_addr zone=pickup_webhook:10m rate=10r/m;
    # Password guesses against the owners login. The pickup list itself is not limited.
    limit_req_zone $binary_remote_addr zone=owners_login:10m rate=5r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # Rewrite index.html to clean URL
        rewrite ^/index\.html$ / permanent;
        
        # Rewrite produk.html to /pricing
        rewrite ^/produk\.html$ /pricing permanent;

        rewrite ^/menu\.html$ /menu permanent;

        # Serve index.html for root path
        location = / {
            try_files /index.html =404;
        }

        # Serve produk.html for /pricing path
        location = /pricing {
            try_files /produk.html =404;
        }

        location = /menu {
            try_files /menu.html =404;
        }

        # Shared price list. Short cache so a price edit shows up quickly.
        location = /data/services.json {
            default_type application/json;
            add_header Cache-Control "public, max-age=300" always;
            try_files /data/services.json =404;
        }

        # Browser / Formspree → Square pickup bridge
        location = /webhooks/formspree-pickup {
            limit_req zone=pickup_webhook burst=5 nodelay;

            # Preflight. "O" = OPTIONS, "X" = origin is not one of the two hosts.
            set $cors_preflight "";
            if ($request_method = OPTIONS) {
                set $cors_preflight "O";
            }
            if ($cors_allow_origin = "") {
                set $cors_preflight "${cors_preflight}X";
            }
            if ($cors_preflight = "O") {
                add_header Access-Control-Allow-Origin $cors_allow_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Accept, X-App-Key, X-Test" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary "Origin" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            if ($cors_preflight = "OX") {
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://pickup-bridge:8080/webhooks/formspree-pickup;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin $http_origin;
            proxy_set_header Formspree-Signature $http_formspree_signature;
            proxy_set_header X-App-Key $http_x_app_key;
            proxy_set_header X-Test $http_x_test;
            proxy_read_timeout 60s;
        }

        # Owners board. Login is rate-limited; the list is not cached or indexed.
        location = /owners/login {
            limit_req zone=owners_login burst=3 nodelay;

            proxy_pass http://pickup-bridge:8080/owners/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-store" always;
        }

        location /owners {
            proxy_pass http://pickup-bridge:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Cache-Control "no-store" always;
        }

        # For all other requests, try the file as-is
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
